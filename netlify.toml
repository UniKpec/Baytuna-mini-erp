# Frontend Netlify'da yayınlanıyor. Repo monorepo olduğu için base'i belirtmek şart,
# yoksa Netlify kökte package.json arar ve build başarısız olur.
#
# build command ve publish BİLEREK yazılmadı. Netlify Next.js'i kendisi tanıyıp
# OpenNext adaptörünü uyguluyor; publish elle verilirse "custom publish path"
# sayılıp otomatik yapılandırma devre dışı kalıyor ve .next düz statik klasör
# olarak yükleniyor (fonksiyon üretilmiyor, site 404 veriyor).

[build]
  base = "frontend"

[build.environment]
  # Next.js 16 Node 20+ istiyor; yerelde kullandığımız sürümle aynı tutuyoruz.
  NODE_VERSION = "22"
