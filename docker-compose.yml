services:
  service-b:
    image: ghcr.io/${GITHUB_OWNER}/mini-erp-service-b:latest
    restart: unless-stopped
    ports:
    - "8080:8080"
    environment:
      Jwt__Secret: ${JWT_SECRET}
      ConnectionStrings__DefaultConnection: "Host=postgres-b;Port=5432;Database=MiniErpDb;Username=postgres;Password=${POSTGRES_B_PASSWORD}"
      # Servis A token'i uretir, Servis B dogrular; ayni secret olmadan dogrulama calismaz.
      Jwt__Secret: ${JWT_SECRET}
      Jwt__Issuer: ${JWT_ISSUER:-MiniErp.ServiceA}
      Jwt__Audience: ${JWT_AUDIENCE:-MiniErp.ServiceB}
    depends_on:
      - postgres-b

  postgres-b:
    image: postgres:18
    restart: unless-stopped
    environment:
      POSTGRES_DB: MiniErpDb
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_B_PASSWORD}
    volumes:
      - postgres_b_data:/var/lib/postgresql

  service-a:
    build: ./service-a
    image: ghcr.io/unikpec/mini-erp-service-a:latest
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      JWT_SECRET: ${JWT_SECRET}
      DATABASE_URL: postgresql://erp:erp123@postgres-a:5432/service_a_db
      # JWT sozlesmesi: bu uc deger iki serviste de AYNI olmak zorunda.
      JWT_SECRET: ${JWT_SECRET}
      JWT_ISSUER: ${JWT_ISSUER:-MiniErp.ServiceA}
      JWT_AUDIENCE: ${JWT_AUDIENCE:-MiniErp.ServiceB}
      CORS_ORIGINS: ${CORS_ORIGINS}
      RESEND_API_KEY: ${RESEND_API_KEY}
      RESEND_FROM: ${RESEND_FROM}
      SMTP_HOST: ${SMTP_HOST}
      SMTP_PORT: ${SMTP_PORT}
      SMTP_USER: ${SMTP_USER}
      SMTP_PASSWORD: ${SMTP_PASSWORD}
      SMTP_FROM: ${SMTP_FROM}
    depends_on:
      - postgres-a
    volumes:
      - ./service-a:/app

  postgres-a:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: erp
      POSTGRES_PASSWORD: erp123
      POSTGRES_DB: service_a_db
    volumes:
      - postgres_a_data:/var/lib/postgresql/data

volumes:
  postgres_b_data:
  postgres_a_data: