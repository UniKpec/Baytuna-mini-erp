services:
  service-b:
    build:
      context: ./service-b
      dockerfile: Dockerfile
    ports:
      - "5002:8080"
    environment:
      ConnectionStrings__DefaultConnection: "Host=postgres-b;Port=5432;Database=MiniErpDb;Username=postgres;Password=postgres"
    depends_on:
      - postgres-b
  
  postgres-b:
    image: postgres:18
    environment:
      POSTGRES_DB: MiniErpDb
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5434:5432"
    volumes:
      - postgres_b_data:/var/lib/postgresql

volumes:
  postgres_b_data:

